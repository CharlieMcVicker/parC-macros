# This is a Paradigm config file
# Generated automatically from CSVs (in-place morphemes)
kind: Paradigm
part_of_speech: $verb
stage_order:
- expand_nfs
- final_dropping
- aspect_suffix
- tense
- h_alternation
- tag_h_metathesis
- mark_stem_initial_vowel
- pronominal
- drop_stem_initial_vowel
- h_metathesis
- insert_dist
- insert_wi
global_markers:
- kind: rule
  stage: expand_nfs
  value: $expand_nfs
- kind: rule
  stage: final_dropping
  value: $drop_root_final
- kind: rule
  stage: aspect_suffix
  value: $aspect_replace
- kind: rule
  stage: tense
  value: $tense_replace
- kind: rule
  stage: h_alternation
  value: $h_alternation
- kind: rule
  stage: tag_h_metathesis
  value: $tag_h_metathesis
- kind: rule
  stage: mark_stem_initial_vowel
  value: $mark_stem_initial_vowel
- kind: rule
  stage: pronominal
  value: $pro_replace
- kind: rule
  stage: drop_stem_initial_vowel
  value: $drop_stem_initial_vowel
- kind: rule
  stage: h_metathesis
  value: $h_metathesis
- kind: rule
  stage: insert_dist
  value: $insert_DIST
- kind: rule
  stage: insert_wi
  value: $insert_WI
open_root_template: <PrepronominalPrefixes><PrefixClass><Pro><H_metathesis><H_alt><Root><AspectClass><Variant><Aspect><Tense>
template:
- <PrepronominalPrefixes>
- slot:pronominal
- <H_metathesis>
- <H_alt>
- <Root>
- slot:aspect
- slot:tense
slots:
- name: pronominal
  role: prefix
  rule: $pro_replace
  sources:
  - verb-pronominal.csv
  structure:
  - TagGroup: PrefixClass
    optional: false
  - TagGroup: Pro
    optional: false
- name: aspect
  role: suffix
  rule: $aspect_replace
  sources:
  - verb-aspect.csv
  - verb-aspect-stative.csv
  structure:
  - TagGroup: AspectClass
    optional: false
  - TagGroup: Variant
    optional: true
  - TagGroup: Aspect
    optional: false
- name: tense
  role: suffix
  rule: $tense_replace
  sources:
  - verb-tense.csv
  structure:
  - TagGroup: Tense
    optional: false
