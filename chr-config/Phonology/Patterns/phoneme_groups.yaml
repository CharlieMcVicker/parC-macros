kind: Patterns
patterns:
- name: Consonants
  pattern: <Stops>|<Frc>|<Son>|<N>
  ref: <C>
- name: PrepronominalPrefixes
  ref: <PrepronominalPrefixes>
  pattern: '[WI]?([DIST=de]|[DIST=di])?'
- name: NotLarC
  pattern: '{tkmnslyw}'
  ref: <NotLarC>
- name: NotLar
  pattern: <NotLarC>|<V>
  ref: <NotLar>
- name: Onset
  pattern: "s?(<C>|((<NotLarC>|(tl)|(kw)|(ts))h?))"
  ref: <Onset>
- name: Coda
  pattern: "s?((<NotLarC>|(ts)|(kw))?h?)|'"
  ref: <Coda>
- name: Root
  ref: <Root>
  pattern: <V>?<Coda>?(<Onset><V><Coda>)*<Onset>?
- name: SonH
  pattern: nh|lh|yh|wh|mh
  ref: <SonH>
- name: HTarget
  pattern: h<V>|<SonH>
  ref: <HTarget>
- name: HMetaPro
  pattern: '[Pro=1sg.B]|[Pro=2sg.B]|[Pro=3sg.A]'
  ref: <HMetaPro>
