kind: Patterns
patterns:
- name: Consonants
  pattern: <Stops>|<Frc>|<Son>|<N>
  ref: <C>
- name: PrepronominalPrefixes
  ref: <PrepronominalPrefixes>
  pattern: '[WI]?([DIST=de]|[DIST=di])?'
- name: Root
  ref: <Root>
  pattern: <V>?(<C>+<V>)*<C>*
- name: PrefixClass
  ref: <PrefixClass>
  pattern: '[PrefixClass=a_stem]|[PrefixClass=v_stem]|[PrefixClass=e_stem]|[PrefixClass=k_a_stem]|[PrefixClass=vowel_stem]|[PrefixClass=cons_stem]|[PrefixClass=r_stem]'
- name: Pro
  ref: <Pro>
  pattern: '[Pro=1sg.A]|[Pro=Edl.A]|[Pro=Epl.A]|[Pro=Idl.A]|[Pro=Ipl.A]|[Pro=2sg.A]|[Pro=2dl.A]|[Pro=2pl.A]|[Pro=3sg.A]|[Pro=3ns.A]|[Pro=1sg.B]|[Pro=Edl.B]|[Pro=Epl.B]|[Pro=Idl.B]|[Pro=Ipl.B]|[Pro=2sg.B]|[Pro=2dl.B]|[Pro=2pl.B]|[Pro=3sg.B]|[Pro=3ns.B]|[Pro=1sg>3sg]|[Pro=2sg>3sg]'
- name: AspectClass
  ref: <AspectClass>
  pattern: '[AspectClass=a]|[AspectClass=become]|[AspectClass=ko-kots]|[AspectClass=sk-s-hi-hihst]|[AspectClass=sk-s-a]|[AspectClass=sk-s-hst]|[AspectClass=sk-s-la]|[AspectClass=sk-h]|[AspectClass=sk-h-yh]|[AspectClass=hvsk-han]|[AspectClass=hvsk-nh]|[AspectClass=hvsk-n]|[AspectClass=husk]|[AspectClass=episodic]|[AspectClass=terminative]|[AspectClass=terminative-no-o]|[AspectClass=e-aka]|[AspectClass=e-a]|[AspectClass=apl-active]|[AspectClass=apl-active-h]|[AspectClass=apl-active-'']|[AspectClass=apl-active-a]|[AspectClass=apl]|[AspectClass=go]|[AspectClass=go-in]|[AspectClass=cause]|[AspectClass=ih-il]|[AspectClass=hih-hil]|[AspectClass=hih-hilh]|[AspectClass=hih-lh]|[AspectClass=ih-vh]|[AspectClass=vnh-ih-a]|[AspectClass=vnh-vsk]|[AspectClass=i-vka]|[AspectClass=i-a-i]|[AspectClass=i-a-ihsk]|[AspectClass=ih-ihi]|[AspectClass=o]|[AspectClass=be-at]|[AspectClass=oh-al]|[AspectClass=oh-ol]|[AspectClass=v-vhs]|[AspectClass=vsk]|[AspectClass=vsk-long]|[AspectClass=vsk-post-v]|[AspectClass=rev-gi]|[AspectClass=rev-i]|[AspectClass=rev-''i]|[AspectClass=rev-e]|[AspectClass=stative]|[AspectClass=stative-k]|[AspectClass=stative-h]|[AspectClass=stative-s]|[AspectClass=stative-a'']|[AspectClass=stative-eh]'
- name: Variant
  ref: <Variant>
  pattern: ([Variant=2]|[Variant=3]|[Variant=4])?
- name: Aspect
  ref: <Aspect>
  pattern: '[Aspect=present]|[Aspect=incompletive]|[Aspect=completive]|[Aspect=immediate]|[Aspect=infinitive]'
- name: TenseClass
  ref: <TenseClass>
  pattern: '[TenseClass=a_present]|[TenseClass=i_present]'
- name: Tense
  ref: <Tense>
  pattern: '[Tense=present]|[Tense=immediate]|[Tense=habitual]|[Tense=future_prog]|[Tense=assertive]|[Tense=reported]|[Tense=infinitive]'
- name: Morpheme
  ref: <Morpheme>
  pattern: <PrefixClass>|<Pro>|<AspectClass>|<Aspect>|<TenseClass>|<Tense>|<PPP>|<H_alt>|[WI]|[DIST]|[DIST=de]|[DIST=di]|[Variant=2]|[Variant=3]|[Variant=4]
- name: H_alt
  ref: <H_alt>
  pattern: <H_alt>
- name: NotLar
  pattern: '{tkmnslyw}|<V>'
  ref: <NotLar>
- name: SonH
  pattern: nh|lh|yh|wh|mh
  ref: <SonH>
- name: HTarget
  pattern: h<V>|<SonH>
  ref: <HTarget>
