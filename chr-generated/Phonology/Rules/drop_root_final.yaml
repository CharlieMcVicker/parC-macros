kind: Rules
rules:
- name: mark_final
  description: mark the final phone for deletion based on aspect triggers
  input_pattern: null
  output_pattern: '[drop]'
  left_context: <Phone>
  right_context: '[AspectClass=hvsk-nh][Variant=2][Aspect=infinitive]|[AspectClass=hvsk-nh][Variant=4][Aspect=infinitive]|[AspectClass=hvsk-n][Aspect=infinitive]|[AspectClass=apl][Aspect=immediate]'
- name: mark_final_two
  description: mark the final two phones for deletion based on aspect triggers
  input_pattern: null
  output_pattern: '[drop]'
  left_context: <Phone><Phone>?
  right_context: '[AspectClass=apl][Variant=2][Aspect=immediate]'
- name: drop_final
  description: drop final phone
  rule_sequence:
  - $mark_final
- name: drop_final_two
  description: drop final two phones
  rule_sequence:
  - $mark_final_two
- name: drop_root_final
  description: drop final root phone(s) conditioned on aspect class and aspect tags
  rule_sequence:
  - $drop_final_two
  - $drop_final
