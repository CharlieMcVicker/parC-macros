# This is a Rules config file
# Define context-sensitive phonological rules.
kind: Rules
rules:
  - name: h_alternation_drop
    string_map:
      - [h, ""]
    left_context: "[H_DROP]"

  - name: h_alternation_glot
    string_map:
      - [h, "'"]
    left_context: "[H_GLOT]"

  - name: h_alternation_lat
    string_map:
      - [lh, tl]
    left_context: "[H_LAT]"

  - name: delete_h_alt_tags
    input_pattern: "<H_ALT>"
    output_pattern: ""

  - name: h_alternation
    rule_sequence:
      - $h_alternation_drop
      - $h_alternation_glot
      - $h_alternation_lat
      - $delete_h_alt_tags

