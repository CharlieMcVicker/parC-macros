kind: Rules
rules:
- name: mark_h_vowel_a
  input_pattern: '[H_alt=vowel_a]'
  output_pattern: '[TEMP_VOWEL_A]'
  right_context: <NotLar>*<C>h<C>
- name: tag_h_vowel_a
  input_pattern: h
  output_pattern: '[TEMP_VOWEL_A_H]'
  left_context: '[TEMP_VOWEL_A]<NotLar>*<C>'
  right_context: <C>
- name: delete_trigger_vowel_a
  input_pattern: '[TEMP_VOWEL_A]'
  output_pattern: ''
  right_context: <NotLar>*[TEMP_VOWEL_A_H]
- name: mark_h_vowel_e
  input_pattern: '[H_alt=vowel_e]'
  output_pattern: '[TEMP_VOWEL_E]'
  right_context: <NotLar>*<C>h<C>
- name: tag_h_vowel_e
  input_pattern: h
  output_pattern: '[TEMP_VOWEL_E_H]'
  left_context: '[TEMP_VOWEL_E]<NotLar>*<C>'
  right_context: <C>
- name: delete_trigger_vowel_e
  input_pattern: '[TEMP_VOWEL_E]'
  output_pattern: ''
  right_context: <NotLar>*[TEMP_VOWEL_E_H]
- name: mark_h_vowel_i
  input_pattern: '[H_alt=vowel_i]'
  output_pattern: '[TEMP_VOWEL_I]'
  right_context: <NotLar>*<C>h<C>
- name: tag_h_vowel_i
  input_pattern: h
  output_pattern: '[TEMP_VOWEL_I_H]'
  left_context: '[TEMP_VOWEL_I]<NotLar>*<C>'
  right_context: <C>
- name: delete_trigger_vowel_i
  input_pattern: '[TEMP_VOWEL_I]'
  output_pattern: ''
  right_context: <NotLar>*[TEMP_VOWEL_I_H]
- name: mark_h_vowel_o
  input_pattern: '[H_alt=vowel_o]'
  output_pattern: '[TEMP_VOWEL_O]'
  right_context: <NotLar>*<C>h<C>
- name: tag_h_vowel_o
  input_pattern: h
  output_pattern: '[TEMP_VOWEL_O_H]'
  left_context: '[TEMP_VOWEL_O]<NotLar>*<C>'
  right_context: <C>
- name: delete_trigger_vowel_o
  input_pattern: '[TEMP_VOWEL_O]'
  output_pattern: ''
  right_context: <NotLar>*[TEMP_VOWEL_O_H]
- name: mark_h_vowel_u
  input_pattern: '[H_alt=vowel_u]'
  output_pattern: '[TEMP_VOWEL_U]'
  right_context: <NotLar>*<C>h<C>
- name: tag_h_vowel_u
  input_pattern: h
  output_pattern: '[TEMP_VOWEL_U_H]'
  left_context: '[TEMP_VOWEL_U]<NotLar>*<C>'
  right_context: <C>
- name: delete_trigger_vowel_u
  input_pattern: '[TEMP_VOWEL_U]'
  output_pattern: ''
  right_context: <NotLar>*[TEMP_VOWEL_U_H]
- name: mark_h_vowel_v
  input_pattern: '[H_alt=vowel_v]'
  output_pattern: '[TEMP_VOWEL_V]'
  right_context: <NotLar>*<C>h<C>
- name: tag_h_vowel_v
  input_pattern: h
  output_pattern: '[TEMP_VOWEL_V_H]'
  left_context: '[TEMP_VOWEL_V]<NotLar>*<C>'
  right_context: <C>
- name: delete_trigger_vowel_v
  input_pattern: '[TEMP_VOWEL_V]'
  output_pattern: ''
  right_context: <NotLar>*[TEMP_VOWEL_V_H]
- name: mark_h_lat
  input_pattern: '[H_alt=lat]'
  output_pattern: '[TEMP_LAT]'
  right_context: <NotLar>*lh
- name: tag_h_lat
  string_map:
  - - lh
    - '[TEMP_LAT_H]'
  left_context: '[TEMP_LAT]<NotLar>*'
- name: delete_trigger_lat
  input_pattern: '[TEMP_LAT]'
  output_pattern: ''
  right_context: <NotLar>*[TEMP_LAT_H]
- name: mark_h_drop
  input_pattern: '[H_alt=drop]'
  output_pattern: '[TEMP_DROP]'
  right_context: <NotLar>*<HTarget>
- name: tag_h_drop_medial
  string_map:
  - - nh
    - 'n[TEMP_H]'
  - - lh
    - 'l[TEMP_H]'
  - - yh
    - 'y[TEMP_H]'
  - - wh
    - 'w[TEMP_H]'
  - - mh
    - 'm[TEMP_H]'
  left_context: '[TEMP_DROP]<NotLar>*'
- name: tag_h_drop_init
  string_map:
  - - h
    - '[TEMP_H]'
  left_context: '[TEMP_DROP]<NotLar>*'
  right_context: <V>
- name: delete_trigger_drop
  input_pattern: '[TEMP_DROP]'
  output_pattern: ''
  right_context: <NotLar>*[TEMP_H]
- name: mark_h_glot
  input_pattern: '[H_alt=glot]'
  output_pattern: '[TEMP_GLOT]'
  right_context: <NotLar>*<HTarget>
- name: tag_h_glot_medial
  string_map:
  - - nh
    - '[TEMP_GLOT_H]n'
  - - lh
    - '[TEMP_GLOT_H]l'
  - - yh
    - '[TEMP_GLOT_H]y'
  - - wh
    - '[TEMP_GLOT_H]w'
  - - mh
    - '[TEMP_GLOT_H]m'
  left_context: '[TEMP_GLOT]<NotLar>*'
- name: tag_h_glot_init
  string_map:
  - - h
    - '[TEMP_GLOT_H]'
  left_context: '[TEMP_GLOT]<NotLar>*'
  right_context: <V>
- name: delete_trigger_glot
  input_pattern: '[TEMP_GLOT]'
  output_pattern: ''
  right_context: <NotLar>*[TEMP_GLOT_H]
- name: realize_h_vowel
  string_map:
  - - '[TEMP_VOWEL_A_H]'
    - a
  - - '[TEMP_VOWEL_E_H]'
    - e
  - - '[TEMP_VOWEL_I_H]'
    - i
  - - '[TEMP_VOWEL_O_H]'
    - o
  - - '[TEMP_VOWEL_U_H]'
    - u
  - - '[TEMP_VOWEL_V_H]'
    - v
- name: realize_h_lat
  string_map:
  - - '[TEMP_LAT_H]'
    - tl
- name: realize_h_glot
  string_map:
  - - '[TEMP_GLOT_H]'
    - ''''
- name: delete_target_h
  input_pattern: '[TEMP_H]'
  output_pattern: ''
- name: delete_h_none
  input_pattern: '[H_alt=none]'
  output_pattern: ''
  left_context: <Pro>|[Pro]
- name: h_alternation
  rule_sequence:
  - $mark_h_vowel_a
  - $tag_h_vowel_a
  - $delete_trigger_vowel_a
  - $mark_h_vowel_e
  - $tag_h_vowel_e
  - $delete_trigger_vowel_e
  - $mark_h_vowel_i
  - $tag_h_vowel_i
  - $delete_trigger_vowel_i
  - $mark_h_vowel_o
  - $tag_h_vowel_o
  - $delete_trigger_vowel_o
  - $mark_h_vowel_u
  - $tag_h_vowel_u
  - $delete_trigger_vowel_u
  - $mark_h_vowel_v
  - $tag_h_vowel_v
  - $delete_trigger_vowel_v
  - $mark_h_lat
  - $tag_h_lat
  - $delete_trigger_lat
  - $mark_h_drop
  - $tag_h_drop_medial
  - $tag_h_drop_init
  - $delete_trigger_drop
  - $mark_h_glot
  - $tag_h_glot_medial
  - $tag_h_glot_init
  - $delete_trigger_glot
  - $realize_h_vowel
  - $realize_h_lat
  - $realize_h_glot
  - $delete_target_h
  - $delete_h_none
